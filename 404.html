<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sidan hittades inte – Frånvarokollen</title>
<meta name="robots" content="noindex, follow" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0D1E36;--blue:#2563EB;--cream:#F8FAFC;--ink:#0F172A;--muted:#64748B;--line:#E2E8F0}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;background:var(--cream);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.55}
  main{max-width:560px;text-align:center}
  img{height:48px;width:auto;margin-bottom:28px}
  .code{font-size:14px;font-weight:600;letter-spacing:.14em;color:var(--blue);margin:0 0 8px}
  h1{font-size:clamp(28px,5vw,40px);line-height:1.15;color:var(--navy);margin:0 0 12px;font-weight:800}
  p{color:var(--muted);margin:0 0 24px}
  .links{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:36px}
  .btn{display:inline-block;padding:12px 20px;border-radius:8px;font-weight:600;font-size:15px;text-decoration:none;background:var(--blue);color:#fff}
  .btn.alt{background:#fff;color:var(--navy);border:1px solid var(--line)}
  .btn:hover{filter:brightness(.95)}
  .en{border-top:1px solid var(--line);padding-top:24px}
  .en h2{font-size:18px;color:var(--navy);margin:0 0 6px}
  .en p{margin:0 0 12px;font-size:15px}
  .en a{color:var(--blue);font-weight:600;text-decoration:none;margin:0 8px}
</style>
</head>
<body>
<main>
  <a href="/"><img src="/email/logo.png" alt="Frånvarokollen" width="60" height="48"></a>
  <p class="code">404</p>
  <h1>Sidan hittades inte</h1>
  <p>Länken kan vara gammal eller felstavad. Här är några ställen att börja på.</p>
  <div class="links">
    <a class="btn" href="/">Till startsidan</a>
    <a class="btn alt" href="/guider/">Guider</a>
    <a class="btn alt" href="/vanliga-fragor">Vanliga frågor</a>
    <a class="btn alt" href="/om-oss">Om oss</a>
  </div>
  <div class="en">
    <h2>Page not found</h2>
    <p>The link may be old or mistyped.</p>
    <a href="/en/">Home</a> <a href="/en/faq">FAQ</a> <a href="/en/about">About us</a>
  </div>
</main>
</body>
</html>
